name: LLM Quality

on:
  workflow_dispatch:
  schedule:
    # Mondays at 06:43 UTC (03:43 in Brasilia). GitHub runs schedules on a
    # best-effort basis, so the exact start time can be delayed.
    - cron: '43 6 * * 1'

jobs:
  llm-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-llm.txt

      - name: Install dependencies
        run: pip install -r requirements-llm.txt

      - name: Run LLM-judge tests
        run: python -m pytest -m llm -v
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
